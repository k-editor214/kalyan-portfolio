<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Team — Kalyan Chitteti</title>

<link rel="stylesheet" href="css/style.css">

<style>
.team-page {
  padding: 55px 0 90px;
}

.team-intro {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 40px;
  margin-bottom: 40px;
}

.team-intro h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(55px, 7vw, 90px);
  line-height: .9;
  margin: 0;
}

.team-intro p {
  max-width: 430px;
  color: var(--muted);
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.team-card {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  cursor: pointer;
  transition: .2s ease;
}

.team-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 18px 45px rgba(50,38,25,.1);
}

.team-photo {
  width: 100%;
  aspect-ratio: 4 / 4.5;
  background: #ddd0c2;
  overflow: hidden;
}

.team-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.team-info {
  padding: 20px;
}

.team-info h3 {
  margin: 5px 0;
  font-size: 28px;
}

.team-role {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.team-info p {
  color: var(--muted);
  margin: 8px 0 0;
}

/* EMPTY STATE */

.team-empty {
  padding: 50px;
  border: 1px dashed var(--line);
  border-radius: 20px;
  text-align: center;
  color: var(--muted);
}

/* MODAL */

.team-modal {
  position: fixed;
  inset: 0;
  background: rgba(20,15,12,.65);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.team-modal.active {
  display: flex;
}

.team-modal-box {
  background: var(--paper, #fffaf2);
  max-width: 750px;
  width: 100%;
  border-radius: 24px;
  padding: 25px;
  position: relative;
}

.team-modal-close {
  position: absolute;
  right: 18px;
  top: 15px;
  border: 0;
  background: transparent;
  font-size: 30px;
  cursor: pointer;
}

.team-modal-content {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 25px;
  align-items: center;
}

.team-modal-content img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 18px;
}

.team-modal-content h2 {
  margin: 5px 0;
  font-size: 35px;
}

.team-modal-content p {
  color: var(--muted);
  line-height: 1.6;
}

@media(max-width:900px) {
  .team-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .team-intro {
    display: block;
  }

  .team-intro p {
    margin-top: 20px;
  }
}

@media(max-width:600px) {
  .team-page {
    padding: 40px 16px 70px;
  }

  .team-grid {
    grid-template-columns: 1fr;
  }

  .team-modal-content {
    grid-template-columns: 1fr;
  }

  .team-modal-content img {
    max-width: 220px;
  }
}
</style>
</head>

<body>

<header class="site-header">

  <a class="brand" href="index.html">
    <span class="brand-mark">K</span>
    <span class="brand-text">KALYAN CHITTETI</span>
  </a>

  <button class="menu-toggle" type="button">
    ☰
  </button>

  <nav class="main-nav">

    <a href="index.html">Home</a>
    <a href="showreel.html">Showreel</a>
    <a href="work.html">Work</a>
    <a href="projects.html">Projects</a>
    <a href="team.html">Team</a>
    <a href="tools.html">Tools</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

  </nav>

</header>


<main class="container team-page">

  <section class="team-intro">

    <div>
      <div class="eyebrow">TEAM</div>

      <h1>
        The people<br>
        behind the frame.
      </h1>
    </div>

    <p>
      A creative team built around post-production,
      photography, video and digital storytelling.
    </p>

  </section>


  <!-- SUPABASE TEAM WILL APPEAR HERE -->

  <section
    id="teamLibrary"
    class="team-grid"
    aria-live="polite">
  </section>

</main>


<!-- TEAM MODAL -->

<div id="teamModal" class="team-modal">

  <div class="team-modal-box">

    <button
      id="teamModalClose"
      class="team-modal-close"
      type="button">
      ×
    </button>

    <div class="team-modal-content">

      <img
        id="teamModalImage"
        src=""
        alt="">

      <div>

        <div
          id="teamModalRole"
          class="team-role">
        </div>

        <h2 id="teamModalName"></h2>

        <p id="teamModalBio"></p>

      </div>

    </div>

  </div>

</div>


<footer class="footer container">

  <span>
    © <span class="year"></span> Kalyan Chitteti
  </span>

  <span>
    Video Editor · Colorist · DI Artist
  </span>

  <span>
    India
  </span>

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

  const root = document.getElementById("teamLibrary");

  if (!root) return;

  root.innerHTML =
    '<div class="team-empty">Loading team...</div>';


  /* CHECK SUPABASE */

  if (!window.supabaseClient) {

    root.innerHTML =
      '<div class="team-empty">Supabase connection not found.</div>';

    console.error("supabaseClient is missing");

    return;
  }


  /* GET TEAM */

  const { data, error } =
    await window.supabaseClient
      .from("team_members")
      .select("*")
      .eq("published", true)
      .order("created_at", {
        ascending: true
      });


  /* ERROR */

  if (error) {

    console.error("TEAM ERROR:", error);

    root.innerHTML =
      `<div class="team-empty">
        Unable to load team.<br>
        ${error.message}
      </div>`;

    return;
  }


  /* NO TEAM */

  if (!data || data.length === 0) {

    root.innerHTML =
      `<div class="team-empty">
        No team profiles have been added yet.
      </div>`;

    return;
  }


  /* CLEAR */

  root.innerHTML = "";


  /* CREATE CARDS */

  data.forEach(member => {

    const card =
      document.createElement("article");

    card.className = "team-card";


    const photo =
      member.photo_url ||
      "assets/images/profile/kalyan--profile.jpg";


    card.innerHTML = `

      <div class="team-photo">

        <img
          src="${photo}"
          alt="${escapeHTML(member.name)}"
          loading="lazy">

      </div>

      <div class="team-info">

        <div class="team-role">
          ${escapeHTML(member.role || "")}
        </div>

        <h3>
          ${escapeHTML(member.name || "")}
        </h3>

        <p>
          ${escapeHTML(member.bio || "")}
        </p>

      </div>

    `;


    /* OPEN MODAL */

    card.addEventListener("click", function () {

      openTeamModal(member);

    });


    root.appendChild(card);

  });


});


/* HTML ESCAPE */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* MODAL */

function openTeamModal(member) {

  const modal =
    document.getElementById("teamModal");

  document.getElementById("teamModalImage").src =
    member.photo_url ||
    "assets/images/profile/kalyan--profile.jpg";

  document.getElementById("teamModalImage").alt =
    member.name || "";

  document.getElementById("teamModalName").textContent =
    member.name || "";

  document.getElementById("teamModalRole").textContent =
    member.role || "";

  document.getElementById("teamModalBio").textContent =
    member.bio || "";

  modal.classList.add("active");

}


/* CLOSE */

document
  .getElementById("teamModalClose")
  .addEventListener("click", function () {

    document
      .getElementById("teamModal")
      .classList.remove("active");

  });


/* CLICK OUTSIDE */

document
  .getElementById("teamModal")
  .addEventListener("click", function (event) {

    if (event.target === this) {

      this.classList.remove("active");

    }

  });


/* ESC KEY */

document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {

    document
      .getElementById("teamModal")
      .classList.remove("active");

  }

});

</script>

</body>
</html>
