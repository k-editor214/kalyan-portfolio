<section class="admin-section" id="tab-team">

  <h2>Team Manager</h2>

  <form id="teamForm">

    <div class="admin-field">
      <label for="teamName">Name</label>
      <input
        type="text"
        id="teamName"
        placeholder="Team member name"
        required
      >
    </div>

    <div class="admin-field">
      <label for="teamRole">Role</label>
      <input
        type="text"
        id="teamRole"
        placeholder="Film Editor, Photographer, etc."
        required
      >
    </div>

    <div class="admin-field">
      <label for="teamBio">Bio</label>
      <textarea
        id="teamBio"
        placeholder="Short description"
        rows="4"
      ></textarea>
    </div>

    <div class="admin-field">
      <label for="teamInstagram">Instagram</label>
      <input
        type="url"
        id="teamInstagram"
        placeholder="https://instagram.com/..."
      >
    </div>

    <div class="admin-field">
      <label for="teamLinkedin">LinkedIn</label>
      <input
        type="url"
        id="teamLinkedin"
        placeholder="https://linkedin.com/in/..."
      >
    </div>

    <div class="admin-field">
      <label for="teamPhoto">Team Photo</label>
      <input
        type="file"
        id="teamPhoto"
        accept="image/*"
      >
    </div>

    <button type="submit" class="admin-btn">
      Add Team Member
    </button>

    <p id="teamMsg"></p>

  </form>

  <div id="teamList"></div>

</section>
