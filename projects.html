<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Kalyan Chitteti — Selected video projects.">
<title>Projects — Kalyan Chitteti</title>

<link rel="stylesheet" href="css/style.css">

<style>
.projects-intro{
  max-width:900px;
  margin:0 auto;
  padding:70px 24px 35px;
}

.projects-intro .eyebrow{
  margin-bottom:10px;
}

.projects-intro h1{
  margin:0;
}

.project-grid{
  max-width:1200px;
  margin:0 auto;
  padding:20px 24px 80px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:28px;
}

.project-card{
  overflow:hidden;
  border:1px solid rgba(0,0,0,.12);
  background:#fff;
  border-radius:16px;
}

.project-media{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  background:#111;
  overflow:hidden;
}

.project-media.vertical{
  aspect-ratio:9 / 16;
  max-height:650px;
}

.project-media video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#111;
}

.project-play{
  position:absolute;
  left:18px;
  bottom:18px;
  border:0;
  border-radius:999px;
  padding:11px 17px;
  background:rgba(255,255,255,.94);
  color:#111;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  z-index:2;
}

.project-content{
  padding:20px 20px 22px;
}

.project-content .eyebrow{
  margin-bottom:7px;
}

.project-content h3{
  margin:0;
}

.projects-empty{
  grid-column:1 / -1;
  padding:60px 20px;
  text-align:center;
  opacity:.7;
}

@media(max-width:800px){
  .project-grid{
    grid-template-columns:1fr;
    padding-left:18px;
    padding-right:18px;
  }

  .projects-intro{
    padding-left:18px;
    padding-right:18px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-mark">K</span>
    <span class="brand-text">KALYAN CHITTETI</span>
  </a>

  <button class="menu-toggle" type="button" aria-label="Open menu">
    ☰
  </button>

  <nav class="main-nav">
    <a href="index.html" data-page="home">Home</a>
    <a href="showreel.html" data-page="showreel">Showreel</a>
    <a href="work.html" data-page="work">Work</a>
    <a href="projects.html" data-page="projects">Projects</a>
    <a href="team.html" data-page="team">Team</a>
    <a href="tools.html" data-page="tools">Tools</a>
    <a href="about.html" data-page="about">About</a>
    <a href="contact.html" data-page="contact">Contact</a>
  </nav>
</header>

<main>

  <section class="projects-intro">
    <div class="eyebrow">Project Library</div>
    <h1>Selected Projects.</h1>
  </section>

  <section
    id="projectLibrary"
    class="project-grid"
    aria-live="polite">
  </section>

</main>

<footer class="site-footer">
  <span>© <span class="year"></span> Kalyan Chitteti</span>
  <span>Video Editor · Colorist · DI Artist</span>
  <span>India</span>
</footer>

<!-- Keep the existing app.js unchanged -->
<script src="js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const root = document.getElementById('projectLibrary');

  if (!root) return;

  /*
    IMPORTANT:
    Projects uses the same GitHub assets/videos system
    already used by the Work page.

    No Supabase projects table is used here.
  */

  const groups = [];

  for (const meta of Object.values(CATEGORIES)) {

    const files = await listVideos(meta.folder);

    files.forEach(file => {
      groups.push({
        meta,
        file
      });
    });
  }

  root.innerHTML = '';

  if (!groups.length) {

    root.innerHTML = `
      <div class="projects-empty">
        <p>No project videos were found.</p>
      </div>
    `;

    return;
  }

  groups.forEach(({ meta, file }) => {

    const src =
      `assets/videos/${meta.folder}/${encodeURIComponent(file.name)}`;

    const vertical = meta.ratio === '9:16';

    const title =
      prettyName(file.name, meta.label);

    const card =
      document.createElement('article');

    card.className = 'project-card';

    card.innerHTML = `
      <div class="project-media ${vertical ? 'vertical' : ''}">

        <video
          controls
          playsinline
          preload="metadata"
          src="${src}">
        </video>

        <button
          class="project-play"
          type="button"
          aria-label="Play ${title}">
          ▶ Play
        </button>

      </div>

      <div class="project-content">

        <div class="eyebrow">
          ${meta.label} · ${meta.ratio}
        </div>

        <h3>${title}</h3>

      </div>
    `;

    const video =
      card.querySelector('video');

    const playButton =
      card.querySelector('.project-play');

    playButton.addEventListener('click', () => {

      if (video.paused) {

        video.play().catch(() => {});

        playButton.textContent = '❚❚ Pause';

      } else {

        video.pause();

        playButton.textContent = '▶ Play';
      }

    });

    video.addEventListener('play', () => {
      playButton.textContent = '❚❚ Pause';
    });

    video.addEventListener('pause', () => {
      playButton.textContent = '▶ Play';
    });

    root.appendChild(card);

  });

});
</script>

</body>
</html>
