<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Kalyan Chitteti — Selected visual projects, creative work and post-production."
  >

  <title>Projects — Kalyan Chitteti</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =====================================================
       PROJECTS PAGE
       ===================================================== */

    .projects-intro {
      max-width: 820px;
      margin-bottom: 42px;
    }

    .projects-intro h1 {
      margin-bottom: 14px;
    }

    .projects-intro p {
      max-width: 680px;
      color: var(--muted);
      line-height: 1.7;
    }

    .project-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 26px;
    }

    .project-card {
      background: #fff;
      border: 1px solid rgba(20, 20, 20, 0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 12px 35px rgba(20, 20, 20, 0.07);
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 18px 45px rgba(20, 20, 20, 0.12);
    }

    .project-media {
      position: relative;
      background: #111;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .project-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-content {
      padding: 22px;
    }

    .project-content h3 {
      margin: 8px 0 0;
    }

    .project-content p {
      margin-top: 10px;
      color: #666;
      line-height: 1.6;
    }

    .project-number {
      float: right;
      font-size: 12px;
      color: #999;
    }

    .projects-loading,
    .projects-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .projects-intro {
        margin-bottom: 28px;
      }

      .project-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .project-card {
        border-radius: 18px;
      }

      .project-content {
        padding: 18px;
      }

    }
  </style>
</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <a class="brand" href="index.html">

      <span class="brand-mark">
        K
      </span>

      <span class="brand-text">
        KALYAN CHITTETI
      </span>

    </a>


    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <nav class="main-nav">

      <a
        href="index.html"
        data-page="home"
      >
        Home
      </a>

      <a
        href="showreel.html"
        data-page="showreel"
      >
        Showreel
      </a>

      <a
        href="work.html"
        data-page="work"
      >
        Work
      </a>

      <a
        href="projects.html"
        data-page="projects"
      >
        Projects
      </a>

      <a
        href="team.html"
        data-page="team"
      >
        Team
      </a>

      <a
        href="tools.html"
        data-page="tools"
      >
        Tools
      </a>

      <a
        href="about.html"
        data-page="about"
      >
        About
      </a>

      <a
        href="contact.html"
        data-page="contact"
      >
        Contact
      </a>

    </nav>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="page-shell">

    <section class="page-hero projects-intro">

      <div class="eyebrow">
        PROJECTS
      </div>

      <h1>
        Selected visual projects.
      </h1>

      <p>
        A collection of creative projects,
        visual experiments and post-production work
        by Kalyan Chitteti.
      </p>

    </section>


    <!-- ===================================================
         PROJECTS LOADED BY APP.JS
         =================================================== -->

    <section
      id="projectLibrary"
      class="project-grid"
      aria-live="polite"
    >

      <div class="projects-loading">
        Loading projects...
      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <span>
      ©
      <span class="year"></span>
      Kalyan Chitteti
    </span>

    <span>
      Video Editor · Colorist · DI Artist
    </span>

    <span>
      India
    </span>

  </footer>


  <!-- =====================================================
       MAIN APPLICATION
       ===================================================== -->

  <script src="js/app.js"></script>

</body>

</html>
