<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Kalyan Chitteti — Video Editor, Colorist and DI Artist."
  >

  <title>Work — Kalyan Chitteti</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
    >
      <span class="brand-mark">K</span>

      <span class="brand-text">
        KALYAN CHITTETI
      </span>
    </a>


    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <nav class="main-nav">

      <a
        href="index.html"
        data-page="home"
      >
        Home
      </a>

      <a
        href="showreel.html"
        data-page="showreel"
      >
        Showreel
      </a>

      <a
        href="work.html"
        data-page="work"
      >
        Work
      </a>

      <a
        href="projects.html"
        data-page="projects"
      >
        Projects
      </a>

      <a
        href="team.html"
        data-page="team"
      >
        Team
      </a>

      <a
        href="tools.html"
        data-page="tools"
      >
        Tools
      </a>

      <a
        href="about.html"
        data-page="about"
      >
        About
      </a>

      <a
        href="contact.html"
        data-page="contact"
      >
        Contact
      </a>

    </nav>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <section class="container page-head">

      <div>

        <div class="eyebrow">
          WORK LIBRARY
        </div>

        <h1>
          Selected Work.
        </h1>

      </div>

    </section>


    <section
      class="container section"
      style="padding-top:20px"
    >

      <!-- =================================================
           FILTERS
           ================================================= -->

      <div class="video-filters">

        <button
          class="filter active"
          data-video-filter="all"
        >
          All
        </button>

        <button
          class="filter"
          data-video-filter="reels"
        >
          Reels
        </button>

        <button
          class="filter"
          data-video-filter="advertisements"
        >
          Advertisements
        </button>

        <button
          class="filter"
          data-video-filter="company-designs"
        >
          Company Designs
        </button>

        <button
          class="filter"
          data-video-filter="short-films"
        >
          Short Films
        </button>

        <button
          class="filter"
          data-video-filter="wedding-videos"
        >
          Wedding Videos
        </button>

        <button
          class="filter"
          data-video-filter="story"
        >
          Story
        </button>

        <button
          class="filter"
          data-video-filter="product-promotions"
        >
          Product Promotions
        </button>

        <button
          class="filter"
          data-video-filter="color-grading"
        >
          Color Grading / DI
        </button>

      </div>


      <!-- =================================================
           VIDEO LIBRARY

           app.js loads:
           • Existing portfolio videos
           • Supabase uploaded videos
           ================================================= -->

      <div
        id="videoLibrary"
        class="video-library"
        aria-live="polite"
      >

        <div class="video-loading">
          Loading work...
        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="footer container">

    <span>
      ©
      <span class="year"></span>
      Kalyan Chitteti
    </span>

    <span>
      Video Editor · Colorist · DI Artist
    </span>

    <span>
      India
    </span>

  </footer>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <script src="js/app.js"></script>

</body>

</html>
